name: Pipeline CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install biopython==1.86 plotly==6.9.0 pandas==2.3.3 numpy==2.2.5 pytest==9.1.1

      - name: Run unit tests
        run: |
          PYTHONPATH=code pytest tests/test_pipeline.py -v
